name: Search regression tests

on:
  push:
    branches:
      - william-search-regression
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run alpha-beta equivalence checks
        run: python -m unittest tests.test_search_regression -v
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Validate submission
        run: python validate_submission.py agents/student_agent.py
      - name: Short paired greedy benchmark (4 games)
        run: python simulator.py --player_1 student_agent --player_2 greedy_agent --autoplay --autoplay_runs 4 --strict --seed 0 --quiet
